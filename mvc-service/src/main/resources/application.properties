# The ONLY difference between the two MVC variants. Overridden by env SPRING_THREADS_VIRTUAL_ENABLED.
spring.threads.virtual.enabled=false

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/bench
spring.datasource.username=bench
spring.datasource.password=bench
# Fixed-size pool of 50, mirrored by spring.r2dbc.pool.* in webflux-service.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=50
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

stub.url=${STUB_URL:http://localhost:8090}
# Stub client limits: identical in mvc-service and webflux-service.
stub.max-connections=1000
stub.connect-timeout=2s
stub.response-timeout=10s
stub.acquire-timeout=30s
stub.idle-timeout=30s
