spring.r2dbc.url=r2dbc:postgresql://${DB_HOST:localhost}:5432/bench
spring.r2dbc.username=bench
spring.r2dbc.password=bench
# Fixed-size pool of 50, mirrored by spring.datasource.hikari.* in mvc-service.
spring.r2dbc.pool.initial-size=50
spring.r2dbc.pool.max-size=50
spring.r2dbc.pool.max-acquire-time=30s
spring.r2dbc.pool.max-life-time=30m

stub.url=${STUB_URL:http://localhost:8090}
# Stub client limits: identical in mvc-service and webflux-service.
stub.max-connections=1000
stub.connect-timeout=2s
stub.response-timeout=10s
stub.acquire-timeout=30s
stub.idle-timeout=30s
